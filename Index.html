<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TimeReporter 2000</title>
  <style>
    :root {
      --bg-color: #a3b899;
      --screen-bg: #8ba081;
      --text-color: #0f1c08;
      --border-color: #0f1c08;
      --btn-bg: #7a8f70;
      --btn-active: #5c6f52;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      border: 3px solid var(--border-color);
      background-color: var(--screen-bg);
      padding: 10px;
      border-radius: 4px;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    h1, h2 {
      font-size: 18px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 4px;
      margin-bottom: 10px;
      text-align: center;
    }

    label {
      font-weight: bold;
      font-size: 13px;
      display: block;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    /* 16px font size prevents Safari auto-zoom */
    input, select, textarea, button {
      font-size: 16px !important;
      color: var(--text-color);
      background-color: var(--bg-color);
      border: 2px solid var(--border-color);
      padding: 6px;
      margin-bottom: 6px;
      width: 100%;
      border-radius: 0;
      outline: none;
    }

    input[type="file"] {
      padding: 4px;
      background-color: transparent;
      border: none;
    }

    button {
      background-color: var(--btn-bg);
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 1px 1px 0px var(--border-color);
      margin-top: 10px;
    }

    button:active {
      background-color: var(--btn-active);
      box-shadow: none;
      transform: translate(1px, 1px);
    }

    .entry-list {
      margin-top: 15px;
      border-top: 2px solid var(--border-color);
      padding-top: 10px;
    }

    .entry-item {
      border: 1px solid var(--border-color);
      padding: 8px;
      margin-bottom: 8px;
      background-color: rgba(255, 255, 255, 0.15);
      font-size: 13px;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 4px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 2px;
    }

    .photo-tag {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      background-color: var(--btn-bg);
      border: 1px solid var(--border-color);
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>TimeReporter 2000</h1>

    <form id="time-form">
      <label for="entry-date">Date:</label>
      <input type="date" id="entry-date" required>

      <label for="client-name">Customer / Client:</label>
      <input type="text" id="client-name" placeholder="Customer name" required>

      <label for="job-number">Job Number:</label>
      <input type="text" id="job-number" placeholder="e.g. JOB-1042">

      <label for="project-desc">Description:</label>
      <textarea id="project-desc" rows="2" placeholder="Job details / work done" required></textarea>

      <label for="minutes-logged">Time (Minutes or Hours):</label>
      <input type="text" id="minutes-logged" placeholder="e.g. 7 mins or 0.25 hrs" required>

      <label for="job-photo">Attach Photo (Camera Roll or Camera):</label>
      <input type="file" id="job-photo" accept="image/*">

      <button type="submit">Create Entry</button>
    </form>

    <div class="entry-list">
      <h2>Logged Entries</h2>
      <div id="entries-container"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('time-form');
    const container = document.getElementById('entries-container');
    const dateInput = document.getElementById('entry-date');

    // Set default date to today
    dateInput.value = new Date().toISOString().split('T')[0];

    // Load entries
    let entries = JSON.parse(localStorage.getItem('tr2000_entries') || '[]');

    function renderEntries() {
      container.innerHTML = '';
      if (entries.length === 0) {
        container.innerHTML = '<div style="font-size:13px; text-align:center;">No entries logged.</div>';
        return;
      }
      
      entries.slice().reverse().forEach(entry => {
        const item = document.createElement('div');
        item.className = 'entry-item';
        
        let photoTag = entry.photoRef ? `<div class="photo-tag">📷 Photo: ${escapeHtml(entry.photoRef)}</div>` : '';
        let jobNumHtml = entry.jobNum ? ` | Job #${escapeHtml(entry.jobNum)}` : '';

        item.innerHTML = `
          <div class="entry-header">
            <span>${escapeHtml(entry.client)}${jobNumHtml}</span>
            <span>${escapeHtml(entry.time)}</span>
          </div>
          <div style="margin-top: 4px;"><strong>Date:</strong> ${escapeHtml(entry.date)}</div>
          <div style="margin-top: 4px;"><strong>Desc:</strong> ${escapeHtml(entry.desc)}</div>
          ${photoTag}
        `;
        container.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const date = document.getElementById('entry-date').value;
      const client = document.getElementById('client-name').value;
      const jobNum = document.getElementById('job-number').value;
      const desc = document.getElementById('project-desc').value;
      const time = document.getElementById('minutes-logged').value;
      const photoInput = document.getElementById('job-photo');

      let photoRef = null;
      if (photoInput.files && photoInput.files[0]) {
        photoRef = photoInput.files[0].name || `Photo attached (${date})`;
      }

      entries.push({
        date,
        client,
        jobNum,
        desc,
        time,
        photoRef
      });

      localStorage.setItem('tr2000_entries', JSON.stringify(entries));

      form.reset();
      dateInput.value = new Date().toISOString().split('T')[0];

      if (document.activeElement) {
        document.activeElement.blur();
      }

      renderEntries();
    });

    renderEntries();
  </script>
</body>
</html>
